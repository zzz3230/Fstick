openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/plugins:
    get:
      tags:
      - plugins-controller
      summary: Public catalog, or the caller's own plugins with owned=true
      description: Without owned, returns ACTIVE plugins that have at least one RELEASED branch. With owned=true,
        returns the plugins whose author is X-User-Id (DELETED excluded).
      operationId: getPlugins
      parameters:
      - name: X-User-Id
        in: header
        required: false
        description: Required only with owned=true
        schema:
          type: string
          format: uuid
      - name: owned
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: category
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: search
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: plugin_name
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        "200":
          description: PluginsView of PluginViewShrink items, or of PluginViewOwned items when owned=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginsView"
        "400":
          description: owned=true without X-User-Id (missing_user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
      - plugins-controller
      summary: Create a plugin with an empty template dev branch
      operationId: addPlugin
      parameters:
      - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPluginRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPluginResponse"
        "422":
          description: Icon type is not an image (invalid_type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}:
    get:
      tags:
      - plugins-controller
      summary: Plugin with the branches visible to the caller
      description: |
        Author sees every branch. Anyone else sees RELEASED branches. With chat_id, a member of a chat whose
        installation points at the WORKING branch also sees that branch. No visible branch gives 404.
      operationId: getPlugin
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: chat_id
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginViewExtend"
        "404":
          $ref: "#/components/responses/PluginNotFound"
    put:
      tags:
      - plugins-controller
      summary: Update plugin metadata (author only)
      operationId: updatePlugin
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginViewExtend"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/PluginNotFound"
    delete:
      tags:
      - plugins-controller
      summary: Mark the plugin DELETED (author only)
      operationId: deletePlugin
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeStatusResponse"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/PluginNotFound"
  /api/v1/plugins/{pluginId}/status:
    put:
      tags:
      - plugins-controller
      summary: Set ACTIVE, HIDDEN or DELETED (author only)
      operationId: changeStatus
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              type: string
              enum:
              - ACTIVE
              - DELETED
              - HIDDEN
              - ARCHIVED
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeStatusResponse"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/PluginNotFound"
        "422":
          description: ARCHIVED is not settable (invalid_status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/assets/commit:
    post:
      tags:
      - plugins-controller
      summary: Register uploaded icon and screenshots (author only)
      description: Accepts only plugins/{pluginId}/icon and plugins/{pluginId}/screenshots/* keys and verifies that
        each object exists.
      operationId: commitAssets
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitAssetsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginViewExtend"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/PluginNotFound"
        "422":
          description: Foreign key or object not uploaded (invalid_key, object_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/screenshots:
    post:
      tags:
      - plugins-controller
      summary: Presign screenshot uploads (author only)
      operationId: updateScreenshots
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScreenshotsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateScreenshotsResponse"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/PluginNotFound"
  /api/v1/plugins/{pluginId}/screenshots/{screenshotId}:
    delete:
      tags:
      - plugins-controller
      summary: Delete a screenshot (author only)
      operationId: deleteScreenshot
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      - name: screenshotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          description: Unknown plugin or screenshot (plugin_not_found, screenshot_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/code/server:
    get:
      tags:
      - plugins-controller
      summary: Server (Lua) source of a branch, inline
      description: RELEASED for anyone; WORKING, WAITING_APPROVE, APPROVING, REJECTED and CANCELLED for the
        author only. A branch the caller cannot read is 404.
      operationId: getPluginCodeServer
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "404":
          $ref: "#/components/responses/BranchNotFound"
  /api/v1/plugins/{pluginId}/code/client:
    get:
      tags:
      - plugins-controller
      summary: Client (JS) source of a branch, inline
      description: Same access rules as code/server; additionally a member of chat_id whose installation points at
        the WORKING branch may read it.
      operationId: getPluginCodeClient
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: chat_id
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Quoted sha256 of the source
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "304":
          description: If-None-Match equals the current sha
        "404":
          $ref: "#/components/responses/BranchNotFound"
  /internal/branches/{branchId}:
    get:
      tags:
      - internal-branches-controller
      summary: Branch status, semver and owning plugin (service-to-service, no user gate)
      operationId: getInternalBranch
      parameters:
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBranchResponse"
        "404":
          $ref: "#/components/responses/BranchNotFound"
  /internal/plugins/{pluginId}:
    get:
      tags:
      - internal-plugins-controller
      summary: Plugin status, author and all branches (service-to-service, no user gate)
      operationId: getInternalPlugin
      parameters:
      - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalPluginResponse"
        "404":
          $ref: "#/components/responses/PluginNotFound"
  /internal/plugins/{pluginId}/code/server:
    get:
      tags:
      - internal-plugins-controller
      summary: Server (Lua) source of any branch (service-to-service, no user gate)
      operationId: getInternalServerCode
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "404":
          $ref: "#/components/responses/BranchNotFound"
  /api/v1/plugins/{pluginId}/branches/{branchId}/edit:
    get:
      tags:
      - editor-controller
      summary: Load both sources of the dev branch for the editor
      description: Author only, WORKING branch only. chat_id is echoed and not validated against installations.
      operationId: edit
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"
        "400":
          description: chat_id missing (missing_parameter)
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: Branch is not the dev branch (not_dev_branch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/branches/{branchId}/code:
    put:
      tags:
      - editor-controller
      summary: Save one or both sources of the dev branch
      description: Optimistic concurrency by base_sha; nothing is written on any 4xx. A server (Lua) change triggers
        one Runtime reload after commit; a client (JS) change pushes fstick.plugin.reloaded to the chats running
        the branch. Any runtime key is rejected with 422 runtime_change_unsupported.
      operationId: save
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCodeRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveCodeResponse"
        "400":
          description: chat_id missing (missing_parameter) or malformed base_sha (invalid_sha)
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: stale_code (with current shas) or not_dev_branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: file_too_large (side, limit, actual) or body_too_large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: runtime_change_unsupported or validation_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/branches/{branchId}/reload:
    post:
      tags:
      - editor-controller
      summary: Hot-reload the dev branch in the given chat
      operationId: reload
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Reloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResponse"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: Branch is not the dev branch (not_dev_branch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: reload_throttled, with retry_after_ms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Runtime unavailable (runtime_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/publish:
    post:
      tags:
      - moderation-controller
      summary: Snapshot the dev branch into a candidate branch (author)
      operationId: publish
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: Candidate created in WAITING_APPROVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: The plugin already has an open candidate (open_candidate_exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation_failed, invalid_semver, semver_not_greater (must be strictly greater than the highest RELEASED),
            changelog_too_long, not_dev_branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/moderation/branches:
    get:
      tags:
      - moderation-controller
      summary: Review queue, oldest submission first (moderator)
      operationId: queue
      parameters:
      - $ref: "#/components/parameters/UserId"
      - name: status
        in: query
        required: false
        description: Defaults to both open statuses
        schema:
          type: string
          enum:
          - WAITING_APPROVE
          - APPROVING
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        description: Clamped to 1..100
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueView"
        "403":
          $ref: "#/components/responses/NotModerator"
        "422":
          description: invalid_status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/branches/{branchId}/claim:
    post:
      tags:
      - moderation-controller
      summary: WAITING_APPROVE to APPROVING (moderator)
      description: Repeat by the same moderator returns 200 with the current row.
      operationId: claim
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "403":
          $ref: "#/components/responses/NotModerator"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: claimed_by_other, or invalid_transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/branches/{branchId}/approve:
    post:
      tags:
      - moderation-controller
      summary: APPROVING to RELEASED (the claimer)
      description: Clears plugins.last_rejection and notifies the author (released). Repeat on a RELEASED branch returns 200.
      operationId: approve
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveResponse"
        "403":
          description: not_moderator, or not_claimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: invalid_transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/branches/{branchId}/reject:
    post:
      tags:
      - moderation-controller
      summary: Reject a candidate (moderator)
      description: From WAITING_APPROVE by any moderator, from APPROVING by the claimer only. Sets plugins.last_rejection
        and notifies the author (rejected). Repeat on a REJECTED branch returns 200.
      operationId: reject
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchStatusResponse"
        "403":
          description: not_moderator, or not_claimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: invalid_transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: invalid_reason (required, 1..2000 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/plugins/{pluginId}/branches/{branchId}/cancel:
    post:
      tags:
      - moderation-controller
      summary: Withdraw an open candidate (author)
      description: From WAITING_APPROVE or APPROVING. No notification and no last_rejection. Repeat on a CANCELLED branch
        returns 200.
      operationId: cancel
      parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/BranchId"
      - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchStatusResponse"
        "403":
          $ref: "#/components/responses/NotAuthor"
        "404":
          $ref: "#/components/responses/BranchNotFound"
        "409":
          description: invalid_transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/moderators:
    post:
      tags:
      - internal-moderators-controller
      summary: Grant the moderator role (internal)
      description: Idempotent.
      operationId: grantModerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantModeratorRequest"
      responses:
        "201":
          description: Granted
        "422":
          description: internal_uuid is required (validation_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/moderators/{internalUuid}:
    delete:
      tags:
      - internal-moderators-controller
      summary: Revoke the moderator role (internal)
      description: Idempotent. The moderator check is cached for 60 seconds.
      operationId: revokeModerator
      parameters:
      - name: internalUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
components:
  parameters:
    PluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatId:
      name: chat_id
      in: query
      required: true
      schema:
        type: string
  responses:
    NotAuthor:
      description: Caller is not the plugin author (not_author)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotModerator:
      description: Caller is not a moderator (not_moderator)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PluginNotFound:
      description: Unknown plugin, or no branch visible to the caller (plugin_not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BranchNotFound:
      description: Unknown plugin or branch, or a branch not visible to the caller (plugin_not_found, branch_not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    PluginRequest:
      required:
      - description
      - name
      type: object
      properties:
        name:
          maxLength: 50
          minLength: 0
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        category:
          maxLength: 50
          minLength: 0
          type: string
        tags:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
    AddPluginRequest:
      required:
      - description
      - name
      type: object
      properties:
        icon:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FileRequest"
