      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        status:
          type: string
          example: APPROVING
        claimed_by:
          type: string
          format: uuid
    ApproveResponse:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        status:
          type: string
          example: RELEASED
        semver:
          type: string
