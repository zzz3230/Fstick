      type: object
      required:
      - source_branch_id
      - semver
      properties:
        source_branch_id:
          type: string
          format: uuid
        semver:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          example: 1.2.0
        changelog:
          type: string
          maxLength: 2000
          nullable: true
    PublishResponse:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        semver:
          type: string
        status:
          type: string
          example: WAITING_APPROVE
