          type: string
          format: uuid
        plugin_name:
          type: string
        branch_id:
          type: string
          format: uuid
        semver:
          type: string
        changelog:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - WAITING_APPROVE
          - APPROVING
        author:
          type: object
          description: The Gateway adds mxid
          properties:
            id:
              type: string
              format: uuid
        submitted_at:
          type: string
        claimed_by:
          type: string
          format: uuid
          nullable: true
