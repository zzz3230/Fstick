    CodeResponse:
      type: object
      properties:
        text:
          type: string
        sha:
          type: string
          example: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    EditResponse:
      type: object
      properties:
        plugin:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            author_id:
              type: string
              format: uuid
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              example: WORKING
            runtime:
              type: object
              properties:
                client:
                  type: string
                  example: cl.js@1.0.0
                server:
                  type: string
                  example: sv.lua@1.0.0
        source:
          type: object
          properties:
            client:
              $ref: "#/components/schemas/CodeResponse"
            server:
              $ref: "#/components/schemas/CodeResponse"
        chat_id:
          type: string
    SaveCodeSide:
      type: object
      required:
      - text
      - base_sha
      properties:
        text:
          type: string
          description: At most 500000 bytes UTF-8
        base_sha:
          type: string
          example: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    SaveCodeRequest:
      type: object
      description: At least one of client, server. The runtime key is always rejected (422).
      properties:
        client:
          $ref: "#/components/schemas/SaveCodeSide"
        server:
          $ref: "#/components/schemas/SaveCodeSide"
        runtime:
          type: object
    SaveCodeResponse:
      type: object
      properties:
        warnings:
          type: array
          items:
            type: object
            properties:
              side:
                type: string
              message:
                type: string
              line:
                type: integer
        sha:
          type: object
          properties:
            client:
              type: string
            server:
              type: string
        reloaded:
          type: boolean
        retry_after_ms:
          type: integer
          format: int64
          nullable: true
        client_changed:
          type: boolean
    ReloadResponse:
      type: object
      properties:
        reloaded:
          type: boolean
    InternalBranchResponse:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        plugin_id:
          type: string
          format: uuid
        status:
          type: string
        semver:
          type: string
          nullable: true
    InternalPluginResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        author_id:
          type: string
          format: uuid
        branches:
          type: array
          items:
            $ref: "#/components/schemas/InternalBranch"
