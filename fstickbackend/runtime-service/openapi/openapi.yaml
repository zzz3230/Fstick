openapi: 3.0.1
info:
  title: Runtime Service API
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /command:
    post:
      tags:
      - plugin-execute-controller
      operationId: handleCommand
      parameters:
      - in: header
        name: X-User-Id
        required: true
        schema:
          type: string
        description: Идентификатор пользователя, отправившего команду
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommandResponse"
  /plugins/{pluginId}/state:
    get:
      tags:
      - plugin-execute-controller
      operationId: getPluginState
      parameters:
      - in: path
        name: pluginId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: chat_id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Текущий стейт плагина для указанного чата
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    CommandRequest:
      type: object
      required:
      - name
      - pluginId
      - chatId
      properties:
        name:
          type: string
          description: Имя команды плагина
        pluginId:
          type: string
          format: uuid
          description: Идентификатор плагина
        chatId:
          type: string
          description: Идентификатор чата
        trackId:
          type: string
          description: Идентификатор трека (опционально)
        args:
          type: object
          additionalProperties:
            type: object
          description: Аргументы команды
    CommandError:
      type: object
      properties:
        message:
          type: string
          description: Сообщение об ошибке
        code:
          type: string
          description: Код ошибки (RUNTIME_ERROR, COMMAND_NOT_FOUND, VALIDATION_ERROR)
        details:
          type: string
          description: Дополнительные детали (стек и т.п.)
    CommandResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - RUNTIME_ERROR
          - COMMAND_NOT_FOUND
          - VALIDATION_ERROR
          description: Статус выполнения команды
        response:
          type: object
          additionalProperties:
            type: object
          description: Результат выполнения команды (из return хендлера)
        error:
          $ref: "#/components/schemas/CommandError"
        state:
          type: object
          additionalProperties:
            type: object
          description: Актуальный стейт плагина после выполнения команды (null, если не изменился)
