openapi: 3.0.3

info:
  title: Plugin Installation Service API
  description: |
    Internal REST API микросервиса управления установками плагинов.
  version: 1.0.0
  contact:
    name: Backend Team

servers:
  - url: http://installation-service:8080/api/v1
    description: Internal Docker network

tags:
  - name: installations
    description: Управление установками плагинов пользователей

security:
  - InternalGatewayHeader: []

components:

  securitySchemes:
    InternalGatewayHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Matrix User ID, проставляется Gateway Service после проверки токена в Dendrite

  schemas:

    Installation:
      type: object
      properties:
        installation_id:
          type: integer
          format: int64
          example: 101
          description: Уникальный идентификатор записи установки
        plugin_id:
          type: integer
          format: int64
          example: 42
          description: ID плагина из Plugin Registry
        version_id:
          type: integer
          format: int64
          example: 7
          description: ID версии из таблицы versions
        version_number:
          type: string
          example: "1.2.0"
          description: Номер установленной версии (денормализован для удобства чтения)
        user_id:
          type: string
          example: "@maksim:homeserver.org"
          description: Matrix User ID пользователя
        settings:
          type: object
          nullable: true
          additionalProperties: true
          example: { "theme": "dark", "notifications": true }
          description: Пользовательские настройки плагина в произвольном JSON формате
        status:
          type: string
          enum: [active, deactivated]
          example: active
          description: |
            active — плагин установлен и активен.
            deactivated — плагин удалён с keep_settings=true, настройки сохранены.
        installed_at:
          type: string
          format: date-time
          example: "2026-04-11T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-04-11T12:30:00Z"
      required:
        - installation_id
        - plugin_id
        - version_id
        - version_number
        - user_id
        - status
        - installed_at
        - updated_at

    InstallationShort:
      type: object
      description: Краткое представление установки для списков
      properties:
        installation_id:
          type: integer
          format: int64
          example: 101
        plugin_id:
          type: integer
          format: int64
          example: 42
        version_number:
          type: string
          example: "1.2.0"
        status:
          type: string
          enum: [active, deactivated]
          example: active
        installed_at:
          type: string
          format: date-time
          example: "2026-04-11T10:00:00Z"
      required:
        - installation_id
        - plugin_id
        - version_number
        - status
        - installed_at

    InstallRequest:
      type: object
      properties:
        plugin_id:
          type: integer
          format: int64
          example: 42
          description: ID плагина который нужно установить
        version_id:
          type: integer
          format: int64
          example: 7
          description: ID конкретной версии. Если не указан — устанавливается последняя версия плагина.
      required:
        - plugin_id

    PatchInstallationRequest:
      type: object
      description: Все поля опциональны — обновляются только переданные
      properties:
        version_id:
          type: integer
          format: int64
          example: 8
          description: Новая версия плагина (обновление). Должна быть совместима с текущим мессенджером.
        settings:
          type: object
          nullable: true
          additionalProperties: true
          example: { "theme": "light", "notifications": false }
          description: Новые пользовательские настройки. Полностью заменяют старые.

    PaginatedInstallations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InstallationShort'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total_count:
          type: integer
          example: 5
        has_next:
          type: boolean
          example: false
      required:
        - data
        - page
        - limit
        - total_count
        - has_next

    InstallWarning:
      type: object
      properties:
        code:
          type: string
          enum: [VERSION_MISMATCH, CONFLICT_WITH_INSTALLED]
          example: VERSION_MISMATCH
        message:
          type: string
          example: "Plugin requires messenger version 2.0+, current is 1.8"
      required:
        - code
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Машиночитаемый код ошибки
          example: PLUGIN_NOT_FOUND
        message:
          type: string
          description: Человекочитаемое описание
          example: "Plugin with id 42 not found or not active"
      required:
        - error
        - message

paths:

  /installations:

    post:
      tags: [installations]
      summary: Установить плагин
      description: |
        Создаёт запись установки плагина для текущего пользователя.
        Перед созданием сервис обращается к Plugin Registry Service чтобы убедиться
        что плагин существует и имеет статус active.
        Если у плагина есть предупреждения совместимости — они возвращаются в поле warnings,
        но установка при этом всё равно выполняется (статус 201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
      responses:
        '201':
          description: Плагин успешно установлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  installation:
                    $ref: '#/components/schemas/Installation'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstallWarning'
                    description: Предупреждения о совместимости. Пустой массив если всё ок.
                required:
                  - installation
                  - warnings
        '400':
          description: Некорректный запрос (невалидный plugin_id или version_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Плагин или версия не найдены в Registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Плагин уже установлен у этого пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ALREADY_INSTALLED
                message: "Plugin 42 is already installed. Use PATCH to update version."

    get:
      tags: [installations]
      summary: Список установленных плагинов текущего пользователя
      description: |
        Возвращает все установки пользователя, чей X-User-Id передан в заголовке.
        Пользователь не может просматривать установки других пользователей —
        фильтрация по user_id происходит автоматически на уровне сервиса.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
        - name: status
          in: query
          description: Фильтр по статусу. Без параметра — возвращаются все.
          schema:
            type: string
            enum: [active, deactivated]
          example: active
      responses:
        '200':
          description: Список установок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstallations'

  /installations/{installation_id}:

    parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 101

    get:
      tags: [installations]
      summary: Получить детали установки
      description: |
        Возвращает полную информацию об установке, включая поле settings.
        Используется когда пользователь открывает настройки конкретного плагина.
        Возвращает 403 если installation принадлежит другому пользователю.
      responses:
        '200':
          description: Детали установки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '403':
          description: Установка принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: FORBIDDEN
                message: "You don't have access to this installation"
        '404':
          description: Установка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [installations]
      summary: Обновить версию или настройки плагина
      description: |
        Частичное обновление установки. Обновляются только переданные поля.
        Используется для двух сценариев:
        1. Обновление плагина до новой версии — передаётся version_id
        2. Сохранение пользовательских настроек — передаётся settings
        При обновлении version_id сервис проверяет совместимость новой версии.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchInstallationRequest'
      responses:
        '200':
          description: Установка обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  installation:
                    $ref: '#/components/schemas/Installation'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstallWarning'
                required:
                  - installation
                  - warnings
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Установка принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Установка или версия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Версия несовместима с текущим мессенджером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VERSION_INCOMPATIBLE
                message: "Version 2.0.0 requires messenger 3.0+, current is 2.1"

    delete:
      tags: [installations]
      summary: Удалить установку плагина
      description: |
        Удаляет установку плагина у пользователя.
        keep_settings=true — запись помечается как deactivated, settings сохраняются в БД.
          Используется когда пользователь хочет переустановить плагин позже с теми же настройками.
        keep_settings=false (default) — запись физически удаляется вместе с settings.
          Полная очистка без возможности восстановления.
      parameters:
        - name: keep_settings
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: true — сохранить настройки при удалении
          example: true
      responses:
        '204':
          description: Установка успешно удалена (тело ответа пустое)
        '403':
          description: Установка принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Установка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
